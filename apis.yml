aid: upandup
name: Up&Up
description: Up&Up (legal name Homevest Inc.) is a New York-based rental housing platform
  that lets renters build wealth while they rent. Instead of a traditional security deposit,
  renters contribute to an Up&Up Wallet that grows through their own contributions, a share
  of monthly rental profits, and appreciation in the home's value; at lease end they can
  buy the home, transfer the wallet to another Up&Up rental, renew, or cash out. Founded
  by Michael Wong, Ryan Brown, and Ben Wong, and backed by Khosla Ventures, Up&Up operates
  a consumer web application and a private backend at api.upandup.co, but publishes no
  public developer API, documentation, or SDKs.
